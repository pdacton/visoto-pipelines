[project]
name = "cmatch"
version = "0.1.0"
description = "Concept matching: links auto-profiled slots to a metadata registry (value domains, data element concepts)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==2.0.*",
  "rdflib>=7.6",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "pyshacl>=0.40"]
llm = [
    "anthropic>=2.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
