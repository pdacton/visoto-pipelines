# Reusable: run one pipeline and publish it as the <name>-latest release.
name: pipeline

on:
  workflow_call:
    inputs:
      name:
        description: Pipeline folder under pipelines/
        required: true
        type: string

permissions:
  contents: write   # create/update the release

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('scripts/lib.sh') }}

      - name: Fetch, transform, validate
        run: scripts/run.sh ${{ inputs.name }}

      - name: Publish
        run: scripts/publish.sh ${{ inputs.name }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep working files of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-failed-run
          path: |
            pipelines/${{ inputs.name }}/raw
            pipelines/${{ inputs.name }}/out
          retention-days: 7
